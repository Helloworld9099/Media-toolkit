name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install package
        run: python -m pip install -e '.[test]'
      - name: Test
        run: python -m pytest -q
      - name: Smoke test Windows installer and uninstaller
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\install.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows installation failed' }
          & "$env:LOCALAPPDATA\MediaCraft\bin\mediacraft.cmd" --version
          if ($LASTEXITCODE -ne 0) { throw 'Windows launcher failed' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\uninstall.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows uninstall failed' }
          if (Test-Path "$env:LOCALAPPDATA\MediaCraft") { throw 'Windows cleanup did not remove managed files' }
      - name: Smoke test macOS installer and uninstaller
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash install-macos.sh
          "$HOME/.local/bin/mediacraft" --version
          bash uninstall-macos.sh
          test ! -e "$HOME/Library/Application Support/MediaCraft"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate PyPI distributions
        run: |
          python -m pip install --disable-pip-version-check build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Smoke-test installed wheel
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/mediacraft-wheel"
          "$RUNNER_TEMP/mediacraft-wheel/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/mediacraft-wheel/bin/mediacraft" --version
          "$RUNNER_TEMP/mediacraft-wheel/bin/mediacraft" --help
