name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    name: tests (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Identify runner
        run: python -c "import platform, sys; print(platform.platform(), platform.machine(), sys.version)"
      - name: Install package
        run: python -m pip install -e '.[test]'
      - name: Prepare native FFmpeg and FFprobe
        run: python tests/prepare_ffmpeg.py
      - name: Verify executable discovery
        run: python -c "import shutil; assert shutil.which('ffmpeg') and shutil.which('ffprobe')"
      - name: Test media features
        run: python -m pytest -q
      - name: Install MediaCraft (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash install.sh
      - name: Verify installed MediaCraft (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: python tests/smoke_installed.py --python "$HOME/.local/share/mediacraft/venv/bin/python"
      - name: Uninstall MediaCraft (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash uninstall.sh --yes
      - name: Install and verify MediaCraft (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\install.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows installation failed' }
          & "$env:LOCALAPPDATA\MediaCraft\bin\mediacraft.cmd" --version
          if ($LASTEXITCODE -ne 0) { throw 'Windows launcher failed' }
          python tests/smoke_installed.py --python "$env:LOCALAPPDATA\MediaCraft\venv\Scripts\python.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Windows acceptance failed' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\uninstall.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows uninstall failed' }
          if (Test-Path "$env:LOCALAPPDATA\MediaCraft") { throw 'Windows uninstall did not remove managed files' }
      - name: Install and verify MediaCraft (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash install-macos.sh
          "$HOME/.local/bin/mediacraft" --version
          python tests/smoke_installed.py --python "$HOME/Library/Application Support/MediaCraft/venv/bin/python"
          bash uninstall-macos.sh
          test ! -e "$HOME/Library/Application Support/MediaCraft"
