[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mediacraft-cli"
version = "0.6.0"
description = "Cross-platform CLI for image cutouts, audio stems, video stream extraction and design object layers"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{name = "MediaCraft contributors"}]
keywords = ["cli", "ffmpeg", "rembg", "audio-separation", "svg", "layers"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "Pillow>=10.0,<13",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9,<5",
  "defusedxml>=0.7,<1",
  "static-ffmpeg>=3,<4",
]

[project.optional-dependencies]
background = ["rembg[cpu]>=2.0.85,<3"]
music = ["demucs>=4.0.1,<5"]
scene = ["torch>=2.3,<3", "soundfile>=0.12,<1", "huggingface-hub>=0.25,<3", "einops>=0.8,<1", "rotary-embedding-torch>=0.8,<1", "safetensors>=0.4,<1"]
test = ["pytest>=8,<10"]

[project.urls]
Homepage = "https://github.com/Helloworld9099/mediacraft"
Source = "https://github.com/Helloworld9099/mediacraft"
Issues = "https://github.com/Helloworld9099/mediacraft/issues"
Releases = "https://github.com/Helloworld9099/mediacraft/releases"

[project.scripts]
mediacraft = "mediacraft.cli:main"

[tool.setuptools.packages.find]
include = ["mediacraft*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
