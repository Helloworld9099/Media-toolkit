name: Publish MediaCraft Pro v0.7.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0.7.0.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'Helloworld9099/Media-toolkit'
    runs-on: ubuntu-latest
    steps:
      - name: Create verified release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="f1dc24f43995411166f0878f0fb45e47e89e96cc"
          actual="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${target}" --jq '.sha')"
          test "$actual" = "$target"
          if gh release view v0.7.0 --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v0.7.0 is already published."
            exit 0
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## What's new
          
          - Convert images between JPG, PNG, WebP and AVIF where supported by Pillow.
          - Convert videos to MP4, MOV, MKV, AVI, WebM and WMV with FFmpeg.
          - Crop, resize, rotate, flip and adjust images.
          - Create animated GIFs from image sequences or video clips.
          - Generate photo collages in configurable grids.
          
          Existing background removal, audio separation, video splitting and design extraction commands are preserved.
          
          ## Installation
          
          Download the source archive below, then run the installer from the extracted repository folder:
          
          - Windows: `powershell -ExecutionPolicy Bypass -File .\install.ps1`
          - macOS: `bash install-macos.sh`
          - Linux: `bash install.sh`
          
          Requires Python 3.11-3.13. Optional AI processing engines and models are downloaded on first use.
          
          The ZIP and tar.gz files generated by GitHub contain source code, not standalone executables.
          
          ## Verification
          
          Automated tests and installer smoke tests passed on Windows, macOS and Linux:
          https://github.com/Helloworld9099/Media-toolkit/actions/runs/41567417229
          
          The format-conversion features were implemented independently. The third-party MediaCraft-PRO browser app was not copied into this project.
          NOTES
          gh release create v0.7.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$target" \
            --title "MediaCraft Pro v0.7.0" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest
